name: Call Selected DummyJSON API

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Select the API endpoint to call'
        required: true
        type: choice
        options:
          - users
          - posts
          - test

jobs:
  call-api:
    runs-on: ubuntu-latest
    steps:
      - name: Call DummyJSON API
        run: |
          echo "🔗 Selected endpoint: ${{ github.event.inputs.endpoint }}"
          URL="https://dummyjson.com/${{ github.event.inputs.endpoint }}"
          echo "🔗 Calling URL: $URL"
          curl --fail -X GET "$URL"
