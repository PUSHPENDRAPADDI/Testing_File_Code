name: Select a File

on:
  workflow_dispatch:
    inputs:
      file_choice:
        description: 'Choose a file'
        type: choice
        options:
          - README.md
          - package.json
          - src/index.js

jobs:
  process-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Use selected file
        run: |
          echo "You selected: ${{ github.event.inputs.file_choice }}"
          cat "${{ github.event.inputs.file_choice }}"
